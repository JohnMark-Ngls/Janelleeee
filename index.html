<!DOCTYPE html>
<html lang="fil">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>para sa baby ko</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        if (localStorage.getItem("janelle.auth") === "yes") { location.replace("love.html"); }
    </script>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="login">
    <div class="login-inner" id="loginInner">
        <h1>Janelle</h1>
        <p class="tagline">sinulat ko to, type pala:))</p>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="button" class="toggle-pass" id="togglePass" aria-pressed="false">Ipakita</button>
            </div>

            <p class="hint">Hint: aba hulaan mo boi.</p>
            <p class="form-error" id="error" role="alert"></p>

            <button type="submit" class="btn btn-primary">Pumasok</button>
        </form>
    </div>
</main>

<script src="js/effects.js"></script>
<script src="js/login.js"></script>
</body>
</html>
